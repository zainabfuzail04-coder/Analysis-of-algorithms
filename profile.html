{% extends "base.html" %}{% block title %}My Profile{% endblock %}
{% block content %}
<h3 class="mb-3">My Profile</h3>
<form method="post" class="card p-4" style="max-width:640px"><div class="row g-3">
  <div class="col-md-6"><label class="form-label">Full name</label><input class="form-control" name="full_name" value="{{ form.get('full_name','') }}" required></div>
  <div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ form.get('phone','') }}" required></div>
  <div class="col-md-6"><label class="form-label">Email</label><input class="form-control" value="{{ g.email }}" disabled></div>
  <div class="col-md-6"><label class="form-label">ID / CNIC</label><input class="form-control" name="cnic" value="{{ form.get('cnic','') }}"></div>
  <div class="col-md-6"><label class="form-label">City</label><input class="form-control" name="city" value="{{ form.get('city','') }}"></div>
  <div class="col-md-6"><label class="form-label">Address</label><input class="form-control" name="address" value="{{ form.get('address','') }}"></div>
</div><div class="mt-4"><button class="btn btn-primary">Save profile</button></div></form>
{% endblock %}
